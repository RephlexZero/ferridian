# cargo-fuzz crate (nightly-only, excluded from the workspace).
# Run: cargo +nightly fuzz run classfile  (from tools/upstream-watch)

[package]
name = "upstream-watch-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

# Its own workspace root: the repo workspace excludes fuzz crates (nightly-only).
[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
upstream-watch = { path = ".." }

[[bin]]
name = "classfile"
path = "fuzz_targets/classfile.rs"
test = false
doc = false
bench = false
