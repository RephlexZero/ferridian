# cargo-fuzz crate (nightly-only, excluded from the workspace).
# Run: cargo +nightly fuzz run spirv_reflection  (from crates/pack-compiler)

[package]
name = "ferridian-pack-compiler-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

# Its own workspace root: the repo workspace excludes fuzz crates (nightly-only).
[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
ferridian-pack-compiler = { path = ".." }

[[bin]]
name = "spirv_reflection"
path = "fuzz_targets/spirv_reflection.rs"
test = false
doc = false
bench = false
