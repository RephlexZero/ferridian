# cargo-fuzz crate (nightly-only, excluded from the workspace).
# Run: cargo +nightly fuzz run pack_manifest  (from crates/pack-format)

[package]
name = "ferridian-pack-format-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
ferridian-pack-format = { path = ".." }

[[bin]]
name = "pack_manifest"
path = "fuzz_targets/pack_manifest.rs"
test = false
doc = false
bench = false
