# cargo-fuzz crate (nightly-only, excluded from the workspace).
# Run: cargo +nightly fuzz run contract_decode  (from crates/contract)

[package]
name = "ferridian-contract-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

# Its own workspace root: the repo workspace excludes fuzz crates (nightly-only).
[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
ferridian-contract = { path = ".." }

[[bin]]
name = "contract_decode"
path = "fuzz_targets/contract_decode.rs"
test = false
doc = false
bench = false
