# Weekly fuzzing of untrusted-input parsers (§5): pack manifests, SPIR-V
# reflection, the Java<->Rust contract decoder, and the classfile parser that
# reads Mojang jars. Time-boxed per target; any crash uploads its artifact.

name: fuzz

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

jobs:
  fuzz:
    strategy:
      fail-fast: false
      matrix:
        include:
          - crate: crates/pack-format
            target: pack_manifest
          - crate: crates/pack-compiler
            target: spirv_reflection
          - crate: crates/contract
            target: contract_decode
          - crate: tools/upstream-watch
            target: classfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          key: fuzz-${{ matrix.target }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - name: Fuzz ${{ matrix.target }} (10 min)
        working-directory: ${{ matrix.crate }}
        run: cargo +nightly fuzz run ${{ matrix.target }} -- -max_total_time=600
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: ${{ matrix.crate }}/fuzz/artifacts
