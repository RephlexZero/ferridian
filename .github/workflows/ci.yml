# Per-PR pipeline, fast-fail order (§5): lint -> build+test matrix ->
# golden/GPU job in the pinned Mesa container -> supply-chain gates.

name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: taplo-cli,typos-cli
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: taplo fmt --check
      - run: typos

  test:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: cargo nextest run --workspace
      # GPU-gated testkit tests are skipped here (no ICD guarantees on plain
      # runners); the gpu job below runs them against pinned lavapipe.

  gpu:
    needs: lint
    runs-on: ubuntu-latest
    # TODO(container.yml): switch to the immutable GHCR tag once the image
    # workflow has pushed one; building inline keeps this green until then.
    steps:
      - uses: actions/checkout@v4
        with:
          # Golden baselines live in git-lfs; the harness refuses to compare
          # against un-smudged pointer files.
          lfs: true
      - name: Build pinned Mesa image
        run: docker build -f ci/mesa.Dockerfile -t ferridian-mesa:ci .
      - name: GPU + golden tests on lavapipe (validation errors fail)
        run: |
          docker run --rm -v "$PWD:/work" -w /work \
            -e FERRIDIAN_GPU_TESTS=1 \
            ferridian-mesa:ci \
            bash -ec 'rustup show >/dev/null; cargo test -p ferridian-testkit -p ferridian-vk-layer'
      - name: Upload failing renders + heatmaps
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: target/golden-failures/
          if-no-files-found: ignore
      - name: Build reference pack with pinned slangc
        run: |
          docker run --rm -v "$PWD:/work" -w /work \
            ferridian-mesa:ci \
            bash -ec 'rustup show >/dev/null; cargo run -p packc -- build packs/reference'

  shim:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Minecraft 26.x requires Java 25 (see shim/gradle.properties for
          # the verified version set).
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.1"
      - name: Build the Fabric shim against live Maven
        run: gradle -p shim build
      - name: Generated sources are current
        # The shim is ~90% generated; a contract change without a matching
        # regenerated shim must fail here, not at game load time.
        run: |
          cargo run -p shim-codegen
          git diff --exit-code shim/src/main/generated

  gates:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
      # Follow-ups (README): cargo-semver-checks once crates are published,
      # cargo-vet once the audit set is seeded.
