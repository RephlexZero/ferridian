# The one true entrypoint: `mise install` provisions tools, `mise run <task>` runs workflows.
# Rust itself is pinned by rust-toolchain.toml (rustup), not here.
# Loose version pins below get tightened as part of the container-image bump procedure
# (see ci/mesa.Dockerfile) so dev and CI move in lockstep.

[tools]
java = "temurin-25"
gradle = "9.6.1"
lefthook = "1"
taplo = "0.9"
typos = "1"
"cargo:cargo-nextest" = "0.9"
"cargo:cargo-deny" = "0.18"
"cargo:cargo-vet" = "0.10"
# slangc is intentionally NOT mise-managed: its release tarball is bin/slangc
# dynamically linked against sibling lib/*.so files, but the ubi backend only
# extracts a single executable and drops those libs, so the result can't run
# regardless of exe/matching_regex tuning. Install the full tarball yourself
# from https://github.com/shader-slang/slang/releases (version must match
# SLANG_VERSION in ci/mesa.Dockerfile) and set FERRIDIAN_SLANGC to its
# bin/slangc — the devcontainer/CI image already does this for you.

[tasks.setup]
description = "One-time repo setup: git hooks + LFS"
run = ["lefthook install", "git lfs install"]

[tasks.fmt]
description = "Format all Rust code"
run = "cargo fmt --all"

[tasks.lint]
description = "Static checks: fmt, clippy -D warnings, TOML style, typos"
run = [
  "cargo fmt --all -- --check",
  "cargo clippy --workspace --all-targets -- -D warnings",
  "taplo fmt --check",
  "typos",
]

[tasks.test]
description = "Run the test suite with nextest"
run = "cargo nextest run --workspace"

[tasks.build]
description = "Build the workspace"
run = "cargo build --workspace"

[tasks.ci]
description = "Everything CI runs, in fast-fail order"
depends = ["lint", "test"]

[tasks.gpu-test]
description = "Run GPU-gated testkit tests (needs a Vulkan ICD; lavapipe in the container)"
run = "cargo nextest run -p ferridian-testkit"
env = { FERRIDIAN_GPU_TESTS = "1" }

[tasks.golden-bless]
description = "Re-bless golden baselines — ONLY from inside the pinned Mesa container"
run = "cargo nextest run -p ferridian-testkit"
env = { FERRIDIAN_GPU_TESTS = "1", FERRIDIAN_BLESS = "1" }

[tasks.shim-build]
description = "Build the Fabric shim (needs network for Loom/Minecraft resolution; hosted CI runs it in the shim job)"
run = "gradle -p shim build"

[tasks.deny]
description = "Supply-chain gate"
run = "cargo deny check"

[tasks.vet]
description = "Supply-chain audit gate (see supply-chain/)"
run = "cargo vet check"
