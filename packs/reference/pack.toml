# The Ferridian reference pack: dogfoods packc from day one and grows into
# the marquee next-gen-GI showcase (Tier 0, §6 of the project plan).

[pack]
name = "reference"
version = "0.1.0"
authors = ["Ferridian contributors"]

[requirements]
tier = "baseline"

# Shader binding names match resource names — that correspondence is how the
# engine will wire descriptors when passes execute for real.

[[pass]]
name = "shadows"
kind = "graphics"
shader = "shaders/shadows.slang"
inputs = ["game_depth"]
outputs = ["shadow_mask"]

[[pass]]
name = "deferred"
kind = "graphics"
shader = "shaders/deferred.slang"
inputs = ["game_color", "game_depth", "shadow_mask"]
outputs = ["lit"]

[[pass]]
name = "volumetric"
kind = "compute"
shader = "shaders/volumetric.slang"
inputs = ["game_depth", "shadow_mask"]
outputs = ["fog"]

[[pass]]
name = "composite"
kind = "graphics"
shader = "shaders/composite.slang"
inputs = ["lit", "fog"]
outputs = ["swapchain"]
# Linear is the right call for scene-referred color once passes run at mixed
# resolutions; today every read lands on texel centers, where linear and the
# nearest default are identical — the pinned golden proves the filter table
# flows through the artifact without moving a byte. Depth reads elsewhere
# stay nearest (linear-filtered depth is an optional format feature).
filters = { lit = "linear", fog = "linear" }
